<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Box Model</title>
    <style>
           
        /* m:0 and enter or p:0 and enter .... shortcut   */
           * {
                margin: 0;
                padding: 0;
           }

            .box{

                background-color: rgb(33, 92, 94);
            }
            .box1{
                color:lightcyan;                
                padding: 12px;
                margin: 10px;
                border:2px solid black;
                height: 200px;
                box-sizing: border-box;
  
            }             
            .box2{
                   color: antiquewhite;
                   padding: 12px;
                   margin: 10px;
                   border:2px solid rgb(130, 214, 240);
                   height: 200px;
                   box-sizing: border-box;
                   box-sizing: content-box;



            }
    </style>
     <!--  margin element de bahar lagdi hai .. element da backgound retained nhi hovega ..
     see in inspect in webpage 
     content de bahar padding lagdi hai .. so ager main padding kiti hai tn background color padding area  ch ve ayiga .. because padding is inside the content  and the margin is outside the content , outside the element content inside the element, background color padding area  ch rahega  not in the margin area 
     padding content de ander lagdi hai ...   

     note:- box-sizing: border-box means that the height of  my element the height i have written here this height is my border and padding i have written both of them together means by combining both of them 
     content plus border plus padding should be 200 , when i say box sizing border box i am saying this .

   so this is called margin collapse ..
