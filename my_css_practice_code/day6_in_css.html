        /* the specificity of this element selector is 1 */
        h1 {
            /* color: burlywood; */
            color: burlywood;
            color: lightblue important;
        }

    <!--  what is it that is deciding which color, which conficting property will be applied so here in Css there is an algorithm which is called Cascade algorithm css stands for cascading style sheets and to resolve any type of conficts css uses cascade algorithm this algorithm determines which property will be applied in css and which one not be applied .
       
       there are 4 fules :-
       1) position and order of appearance is important. 
       ( ager mane kisi bhi cheej nu bad ch rahkya aa tn oh applied hovegi for ex:- mere is code ch ma .color3 class nu bad ch dita tn us de property applied hovegi or ager change karuge tn us di property apply hovegi jis nu late ch dita hove ga.. try with other class with  different property, ager same selectors use kita hain jive mere tino he class selectors han ... tn ehna vicho jo late ch hovega us di property apply hovegi.. )
       
       ager element selector yan koi or ek se jyada selectors use hove hain to specificity calculate hundi hai ...
       2) specificity says which Css selector is the most specific 
         inline selectors or inline style   (ab to vad priority diti jandi hai )
         ID selectors                    (classes and attributes to vad priority )
         classes and attribites          ( element selector to vad  )
         element selector                 (universal selector to vad )
         universal selector          low priority         
         
    note * :- gatt to gatt specific selector nu use karo why ? keoki us nu overwrite karna easy hovega .. ex:- universal selector nu element selector nal overwrite kar sakde han, element selector nu classes and attribute nu ID selector nal and ID nu inline nal pr ager inline nu change karna paygya tn problem hovegi ...       
    note :- whatis attribute selectors see the code in body and style tag of attribute selector      
       
     3) origin :- if your Css is coming from your browser style because if you have not put Css in any element then the browser style sheet which is user agent style sheet (inspect and see!!)
     yeh browser ne style add karye honge .. ager ham koi style add nhi karege to browser apne ap add karega ...
     
     4) importance :- if you have put important somewhere, then it will be the most important. if your put important then it will become very important and then it will have to be applied to Css .. means yeh inline styles nu ve overwrite kar sakda hai ... 
      man nhi change kar paya important ki madat say inline selector koo

       * element selector pseudo elements = 1 point
